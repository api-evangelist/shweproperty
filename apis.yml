name: Shweproperty
description: >-
  Shweproperty (ShweProperty.com) is Myanmar's leading online real estate marketplace,
  founded in 2015, connecting buyers, renters, sellers, and agents across the country.
  The consumer-facing portal lists residential and commercial properties for sale and
  rent — apartments, condos, houses, land, shops, offices, and industrial zones — in
  Yangon, Mandalay, Naypyidaw, and beyond, alongside new-development project listings,
  home-loan assistance with Myanmar banking partners, property events and expos, and
  real estate news and buyer guides. The platform carries over 200,000 listings with
  500+ added daily and handles tens of thousands of monthly sales inquiries. It was
  surfaced as a 500 Global portfolio company and added to the API Evangelist network.
  No public developer API, SDK, or documentation surface was found during enrichment;
  this remains a consumer web and mobile property portal.
